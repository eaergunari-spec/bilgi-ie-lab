name: Build JupyterLite and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JupyterLite
        run: python -m pip install -r requirements-jupyterlite.txt

      - name: Build JupyterLite
        run: |
          jupyter lite build \
            --contents jupyterlite/content \
            --output-dir jupyterlite-dist

      - name: Assemble complete Pages site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp -r code _site/code
          cp -r data _site/data
          mkdir -p _site/python-lab
          cp -r jupyterlite-dist/. _site/python-lab/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
